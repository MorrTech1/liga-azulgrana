<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel Admin</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="shared/shared.css">

  <link rel="icon" href="imagenes/liga_azulgrana-Photoroom.png">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  
</head>
<body>
     <div id="loginContainer">

      <h1 class="admin-logo">⚙️ Panel Administrador</h1>

       <!-- LOGIN -->
       <section>
         <h2>🔐 Iniciar Sesión </h2>
         <input id="email" placeholder="Email">
         <input id="password" type="password" placeholder="Password">
         <button onclick="login()">Ingresar</button>
        </section>
      </div>

<div class="admin-layout" id="adminLayout" style="display:none;">

      <aside class="admin-sidebar" id="adminSidebar"> 
        <div class="sidebar-top">

          <h1 class="admin-logo">⚙️ Panel Administrador</h1>

          <nav class="menu-lateral">
            <button onclick="mostrarSeccion('Categorias')">CATEGORIAS</button>
            <button onclick="mostrarSeccion('Equipos')">EQUIPOS</button>
            <button onclick="mostrarSeccion('Jugadores')">JUGADORES</button>
            <button onclick="mostrarSeccion('Competencias')">COMPETENCIAS</button>
            <button onclick="mostrarSeccion('Partidos')">PARTIDOS</button>
          </nav>
        </div>

            <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>

      </aside>

      <div class="admin-main">
        <header class="admin-topbar">
          <button class="menu-btn" onclick="toggleSidebar()">☰</button>
          <h1> ⚙️ Panel Admin</h1>
        </header>
        
        <main class="admin-contenido">
          
<section id="seccionCategorias" class="seccion-admin">

    <h2>📂 Categorías</h2>


<div class="toolbar">

    <input
        id="buscarCategoria"
        class="input-busqueda"
        placeholder="Buscar categoría..."
        oninput="filtrarCategorias()">

    <button
        class="btn-crear"
        onclick="mostrarFormularioCategoria()">

        + Nueva Categoría

    </button>

</div>

        <div id="tablaCategorias"></div>

    

</section>
        
        <!-- CREAR EQUIPO -->
              <section id="seccionEquipos" class="seccion-admin">

    <h2>⚽ Equipos</h2>

    <div class="toolbar">

        <input
            id="buscarEquipo"
            placeholder="Buscar equipo..."
            oninput="filtrarEquipos()">

        <button onclick="abrirModalCrearEquipo()" class="btn-crear">
    + Nuevo Equipo
</button>

    </div>

    <div id="tablaEquipos"></div>

</section>
              
              <section id="seccionJugadores" class="seccion-admin">

                <h2>👤 Jugadores</h2>

                <div class="toolbar">

                  <input 
                    id="buscarJugador"
                    placeholder="Buscar jugador..."
                    oninput="filtrarJugadores()">

                    <button class="btn-crear" onclick="abrirModalCrearJugador()">
                      
                      + Nuevo Jugador

                    </button>
                </div>

                <div id="tablaJugadores"></div>

              </section>
  
  <!-- CREAR PARTIDO -->
  
        <section id="seccionCompetencias" class="seccion-admin">
          <h2> 🏆 Competencia </h2>

          <div class="toolbar">
            <input 
            id="buscarFase"
            placeholder="Buscar fase..."
            oninput="filtrarFases()">

            <button 
            class="btn-crear"
            onclick="abrirModalCrearFase()">
              + Nueva fase
          </button>
          </div>

          <div id="tablaFases"></div>

        </section>

   </main>
</div>
</div>

<script src="shared/components/card.js"></script>
<script src="shared/components/table.js"></script>
<script src="shared/components/toast.js"></script>
<script src="shared/components/modal.js"></script>

<script src="admin/views/fases.js"></script>
<script src="admin/views/jugadores.js"></script>
<script src="admin/views/equipos.js"></script>
<script src="admin/views/categorias.js"></script>
<script src="admin.js"></script>
</body>
</html>
