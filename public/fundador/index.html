<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel del Fundador</title>

    <link rel="stylesheet" href="fundador.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="layout">

        <!-- ========================= -->
        <!-- SIDEBAR -->
        <!-- ========================= -->

        <aside class="sidebar">

            <div class="logo">

                <div class="logo-icon">
                    M
                </div>

                <div>

                    <h2>MorrTech</h2>

                    <span>Founder Panel</span>

                </div>

            </div>

            <nav>

                <button class="menu-item active"
                    onclick="mostrarDashboard()">

                    <i class="fa-solid fa-chart-line"></i>

                    Dashboard

                </button>

                <button class="menu-item"
                    onclick="mostrarligas()">

                    <i class="fa-solid fa-trophy"></i>

                    Ligas

                </button>

                <button class="menu-item"
                    onclick="mostrarAdministradores()">

                    <i class="fa-solid fa-user-shield"></i>

                    Administradores

                </button>

                <button class="menu-item">

                    <i class="fa-solid fa-gear"></i>

                    Configuración

                </button>

            </nav>

            <div class="sidebar-footer">

                <button class="logout"
                    onclick="cerrarSesion()">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Cerrar sesión

                </button>

                <small>

                    MorrTech v1.0

                </small>

            </div>

        </aside>

        <!-- ========================= -->
        <!-- CONTENIDO -->
        <!-- ========================= -->

        <main>

            <header class="topbar">

                <div>

                    <h1 id="tituloVista">

                        Dashboard

                    </h1>

                    <p id="subtituloVista">

                        Bienvenido al panel del fundador.

                    </p>

                </div>

                <div class="usuario">

                    <div class="avatar">

                        F

                    </div>

                    <div>

                        <strong>

                            Fundador

                        </strong>

                        <br>

                        <small>

                            MorrTech

                        </small>

                    </div>

                </div>

            </header>

            <section id="contenido">

            </section>

        </main>

    </div>

    <script src="components/card.js"></script>
    <script src="components/table.js"></script>
    <script src="components/button.js"></script>
    <script src="components/modal.js"></script>

    <script src="views/dashboard.js"></script>
    <script src="views/Ligas.js"></script>
    <script src="views/administradores.js"></script>

    <script src="fundador.js"></script>

</body>

</html>
